
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raj Nayak - Snake Game</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#071b26,#102d3b,#07121c);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px 12px;
}
h1 { color: #42ff9e; margin-bottom: 5px; }
.subtitle { color: #b7d5df; margin-bottom: 20px; }
.game {
  max-width: 480px;
  margin: auto;
  padding: 18px;
  background: #122833;
  border: 1px solid #31515e;
  border-radius: 20px;
  box-shadow: 0 10px 40px #0007;
}
.scores {
  display: flex;
  justify-content: space-around;
  margin-bottom: 15px;
}
.scorebox {
  background: #071b26;
  padding: 10px 20px;
  border-radius: 12px;
  color: #42ff9e;
  font-weight: bold;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  background: #081820;
  border: 2px solid #42616b;
  border-radius: 10px;
  touch-action: none;
}
.settings {
  display: flex;
  gap: 12px;
  margin: 15px 0;
}
.settings label {
  flex: 1;
  font-size: 13px;
  color: #c8e1e9;
}
select {
  display: block;
  width: 100%;
  padding: 10px 5px;
  margin-top: 7px;
  border-radius: 8px;
  background: #071b26;
  color: white;
  border: 1px solid #52727e;
}
button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  font-weight: bold;
  background: #42ff9e;
  color: #062018;
}
button:hover { filter: brightness(1.12); }
#start { width: 100%; margin-bottom: 12px; }
#message { color: #ffd166; min-height: 20px; }
.controls {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  justify-content: center;
  gap: 7px;
  margin-top: 15px;
}
.controls button { padding: 13px 5px; font-size: 20px; }
.controls .empty { visibility: hidden; }
.help { color: #b7d5df; font-size: 12px; line-height: 1.8; }
footer { margin-top: 20px; color: #8daab5; font-size: 13px; }
</style>
</head>
<body>

<h1>🐍 SNAKE GAME</h1>
<p class="subtitle">Raj Nayak Gaming Zone | Class 9th</p>

<div class="game">
  <div class="scores">
    <div class="scorebox">SCORE: <span id="score">0</span></div>
    <div class="scorebox">BEST: <span id="best">0</span></div>
  </div>

  <canvas id="board" width="400" height="400"></canvas>

  <div class="settings">
    <label>Snake Color
      <select id="snakeColor">
        <option value="#42ff9e">Neon Green</option>
        <option value="#00c8ff">Blue</option>
        <option value="#ff42d0">Pink</option>
        <option value="#ffe347">Yellow</option>
        <option value="#ff7733">Orange</option>
        <option value="#ffffff">White</option>
      </select>
    </label>
    <label>Fruit Color
      <select id="fruitColor">
        <option value="#ff4057">Red</option>
        <option value="#ff9f1c">Orange</option>
        <option value="#f5e642">Yellow</option>
        <option value="#df64ff">Purple</option>
        <option value="#ffffff">White</option>
      </select>
    </label>
  </div>

  <button id="start">▶ START GAME</button>
  <p id="message">Start दबाएँ और खेलना शुरू करें!</p>

  <div class="controls">
    <span class="empty">.</span>
    <button data-dir="up">⬆️</button>
    <span class="empty">.</span>
    <button data-dir="left">⬅️</button>
    <button data-dir="down">⬇️</button>
    <button data-dir="right">➡️</button>
  </div>

  <p class="help">
    Keyboard: Arrow Keys या W A S D<br>
    फल खाएँ और स्कोर बढ़ाएँ। दीवार या अपने शरीर से टकराने से बचें!
  </p>
</div>

<footer>Made with ❤️ by Raj Nayak | Class 9th</footer>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const message = document.getElementById("message");
const startBtn = document.getElementById("start");

const cell = 20;
const total = canvas.width / cell;

let snake, fruit, dx, dy, nextDx, nextDy;
let score = 0;
let running = false;
let gameOver = false;
let timer = null;

let best = 0;
try {
  best = Number(localStorage.getItem("rajSnakeBest")) || 0;
} catch(e) {}
bestEl.textContent = best;

function resetGame() {
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  dx = 1;
  dy = 0;
  nextDx = 1;
  nextDy = 0;
  score = 0;
  scoreEl.textContent = score;
  gameOver = false;
  running = true;
  placeFruit();
  message.textContent = "शानदार! फल खाइए 🍎";
  startBtn.textContent = "↻ RESTART GAME";
  clearInterval(timer);
  draw();
  timer = setInterval(update, 115);
}

function placeFruit() {
  do {
    fruit = {
      x: Math.floor(Math.random() * total),
      y: Math.floor(Math.random() * total)
    };
  } while (snake.some(s => s.x === fruit.x && s.y === fruit.y));
}

function draw() {
  ctx.fillStyle = "#081820";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Game board grid
  ctx.strokeStyle = "#142a32";
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= total; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0);
    ctx.lineTo(i * cell, canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, i * cell);
    ctx.lineTo(canvas.width, i * cell);
    ctx.stroke();
  }

  // Fruit
  const fx = fruit.x * cell + cell / 2;
  const fy = fruit.y * cell + cell / 2;
  ctx.fillStyle = document.getElementById("fruitColor").value;
  ctx.shadowColor = ctx.fillStyle;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(fx, fy, cell * 0.38, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  const color = document.getElementById("snakeColor").value;
  snake.forEach((part, i) => {
    const inset = i === 0 ? 1 : 2;
    ctx.fillStyle = color;
    ctx.shadowColor = i === 0 ? color : "transparent";
    ctx.shadowBlur = i === 0 ? 10 : 0;
    ctx.beginPath();
    ctx.roundRect(
      part.x * cell + inset,
      part.y * cell + inset,
      cell - inset * 2,
      cell - inset * 2,
      5
    );
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Snake eyes
  const head = snake[0];
  ctx.fillStyle = "#07121c";
  let ex = head.x * cell + cell / 2;
  let ey = head.y * cell + cell / 2;
  if (dx !== 0) {
    ctx.beginPath();
    ctx.arc(ex + dx * 5, ey - 4, 2, 0, 7);
    ctx.arc(ex + dx * 5, ey + 4, 2, 0, 7);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.arc(ex - 4, ey + dy * 5, 2, 0, 7);
    ctx.arc(ex + 4, ey + dy * 5, 2, 0, 7);
    ctx.fill();
  }

  if (!running && !gameOver) {
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 21px Arial";
    ctx.textAlign = "center";
    ctx.fillText("SNAKE GAME", 200, 190);
    ctx.font = "14px Arial";
    ctx.fillText("Press START to play", 200, 220);
  }
}

function update() {
  if (!running) return;

  dx = nextDx;
  dy = nextDy;

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  // Wall collision
  if (
    head.x < 0 || head.x >= total ||
    head.y < 0 || head.y >= total
  ) {
    endGame();
    return;
  }

  const eating = head.x === fruit.x && head.y === fruit.y;

  // Ignore tail if it will move away this turn
  const body = eating ? snake : snake.slice(0, -1);
  if (body.some(part => part.x === head.x && part.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (eating) {
    score += 10;
    scoreEl.textContent = score;

    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try {
        localStorage.setItem("rajSnakeBest", best);
      } catch(e) {}
    }

    placeFruit();
  } else {
    snake.pop();
  }

  draw();
}

function endGame() {
  running = false;
  gameOver = true;
  clearInterval(timer);
  message.textContent = "💥 Game Over! आपका स्कोर: " + score;
  startBtn.textContent = "↻ PLAY AGAIN";
  draw();
  ctx.fillStyle = "#0009";
  ctx.fillRect(30, 155, 340, 90);
  ctx.fillStyle = "#ff5364";
  ctx.textAlign = "center";
  ctx.font = "bold 28px Arial";
  ctx.fillText("GAME OVER!", 200, 192);
  ctx.fillStyle = "white";
  ctx.font = "16px Arial";
  ctx.fillText("Score: " + score, 200, 220);
}

function changeDirection(dir) {
  if (!running) {
    if (!gameOver) resetGame();
    else return;
  }

  const directions = {
    up:    {x: 0, y: -1},
    down:  {x: 0, y: 1},
    left:  {x: -1, y: 0},
    right: {x: 1, y: 0}
  };

  const d = directions[dir];
  if (!d) return;

  // Prevent reversing directly into yourself
  if (d.x === -dx && d.y === -dy) return;

  nextDx = d.x;
  nextDy = d.y;
}

document.addEventListener("keydown", e => {
  const keys = {
    ArrowUp: "up", w: "up", W: "up",
    ArrowDown: "down", s: "down", S: "down",
    ArrowLeft: "left", a: "left", A: "left",
    ArrowRight: "right", d: "right", D: "right"
  };

  if (keys[e.key]) {
    e.preventDefault();
    changeDirection(keys[e.key]);
  }
});

document.querySelectorAll("[data-dir]").forEach(button => {
  button.addEventListener("click", () => {
    changeDirection(button.dataset.dir);
  });
});

startBtn.addEventListener("click", resetGame);

document.getElementById("snakeColor").addEventListener("change", draw);
document.getElementById("fruitColor").addEventListener("change", draw);

// Initial screen
snake = [
  {x: 10, y: 10},
  {x: 9, y: 10},
  {x: 8, y: 10}
];
fruit = {x: 15, y: 10};
dx = 1;
dy = 0;
nextDx = 1;
nextDy = 0;
draw();
</script>
</body>
</html>
